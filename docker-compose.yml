services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${APP_IMAGE:-onorca}
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-8080}:80"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
