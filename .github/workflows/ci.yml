name: CI

on:
  push:
    branches: [ main, master, pipeline ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Cache ANTLR grammar compilation
      id: cache-grammar
      uses: actions/cache@v4
      with:
        path: dist/
        key: antlr-grammar-${{ hashFiles('training.g4') }}
        restore-keys: |
          antlr-grammar-

    - name: Install dependencies
      run: |
        uv sync
        npm install

    - name: Enable virtual environment
      run: |-
        source .venv/bin/activate

    - name: Download ANTLR4
      if: steps.cache-grammar.outputs.cache-hit != 'true'
      run: |
        curl -O https://www.antlr.org/download/antlr-4.9.3-complete.jar

    - name: Compile grammar
      if: steps.cache-grammar.outputs.cache-hit != 'true'
      run: |
        source .venv/bin/activate
        make compile-grammar

    - name: Validate StrictDoc requirements
      run: |
        source .venv/bin/activate
        make strictdoc-validate

    - name: Run type checking
      run: |
        source .venv/bin/activate
        make typecheck

    - name: Run unit tests
      run: |
        source .venv/bin/activate
        make test-python

    - name: Run splitter.py against data.txt.sample
      run: |
        source .venv/bin/activate
        python bin/splitter.py data.txt.sample --output e2e-output-data.csv
        echo "✓ Successfully processed data.txt.sample"

    - name: Run splitter.py against training-sample.txt
      run: |
        source .venv/bin/activate
        python bin/splitter.py training-sample.txt --output e2e-output-training.csv
        echo "✓ Successfully processed training-sample.txt"

    - name: Verify output files exist
      run: |
        test -f e2e-output-data.csv && echo "✓ e2e-output-data.csv created"
        test -f e2e-output-training.csv && echo "✓ e2e-output-training.csv created"

    - name: Display output samples
      run: |
        echo "=== Sample from data.txt.sample output ==="
        head -n 5 e2e-output-data.csv || true
        echo ""
        echo "=== Sample from training-sample.txt output ==="
        head -n 5 e2e-output-training.csv || true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          e2e-output-data.csv
          e2e-output-training.csv
        retention-days: 7

  git-integration-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        npm install

    - name: Set up local git server
      run: |
        git config --global init.defaultBranch main
        mkdir -p /tmp/git-server
        cp bin/git-http-server.js /tmp/git-server/ || true
        cd /tmp/git-server
        for repo in test-repo-empty test-repo-main test-repo-master; do
          git init --bare $repo.git || true
        done
        echo "Git server setup complete"

    - name: Start git server in background
      run: |
        cd /tmp/git-server
        timeout 300 node git-http-server.js > /tmp/git-server.log 2>&1 &
        sleep 2
        echo "Git server started"

    - name: Run git integration tests
      run: |
        npm run test:git
      env:
        CI: 'true'

    - name: Upload git server logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: git-server-logs
        path: /tmp/git-server.log
        retention-days: 7
